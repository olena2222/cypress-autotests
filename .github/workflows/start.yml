name: Cypress Tests in Docker
run-name: Cypress Tests run in Docker
on:
  push:
    branches:
      - gitActions
jobs:
  cypress-tests:
    name: "Run Cypress tests"
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-docker-action@v5
      - uses: actions/checkout@v6
      - name: Docker build
        run: docker build -t cypress:pipeline .
      - name: Docker run
        run: docker run cypress:pipeline